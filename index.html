<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a7a7a"><meta name="apple-mobile-web-app-capable" content="yes">
<title>معلمي - MOALLEMY</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

<style>
:root{
--bg:#faf7f2;--bg2:#f0ebe3;--card:#fff;--fg:#1a1a2e;--fg2:#4a4a6a;--muted:#8e8ea0;
--primary:#1a7a7a;--primary-l:#e0f5f5;--primary-fg:#fff;--accent:#d4a020;--border:#e5e0d8;
--input:#fff;--danger:#dc3545;--danger-bg:#fde8ea;--success:#28a745;--success-bg:#e6f7ed;
--warn:#f0ad4e;--warn-bg:#fef6e6;--r:12px;
}
[data-theme="dark"]{
--bg:#0f1923;--bg2:#162032;--card:#1a2740;--fg:#e8e8f0;--fg2:#a0a0b8;
--muted:#6a6a80;--primary:#40bfb0;--primary-l:#1a3a38;--primary-fg:#0f1923;
--accent:#f0c040;--border:#2a3a50;--input:#1a2740;--danger:#f06070;--danger-bg:#3a1a1f;
--success:#50d080;--success-bg:#1a3a25;--warn:#f0c050;--warn-bg:#3a3018;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--fg);direction:rtl;min-height:100vh;min-height:100dvh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}
.app{max-width:500px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;padding-bottom:env(safe-area-inset-bottom)}
.card{background:var(--card);border-radius:var(--r);padding:16px;border:1px solid var(--border);transition:background .3s,border .3s}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 20px;border-radius:var(--r);border:none;font-family:inherit;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .2s;background:var(--bg2);color:var(--fg)}
.btn:active{transform:scale(.96)}.btn-p{background:var(--primary);color:var(--primary-fg)}.btn-o{background:transparent;border:1.5px solid var(--primary);color:var(--primary)}.btn-d{background:var(--danger);color:#fff}.btn-sm{padding:6px 14px;font-size:.82rem;border-radius:8px}
.inp{width:100%;padding:10px 14px;border-radius:var(--r);border:1.5px solid var(--border);background:var(--input);color:var(--fg);font-family:inherit;font-size:.95rem;outline:none;transition:border .2s}.inp:focus{border-color:var(--primary)}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}.badge-p{background:var(--primary-l);color:var(--primary)}.badge-s{background:var(--success-bg);color:var(--success)}.badge-d{background:var(--danger-bg);color:var(--danger)}.badge-w{background:var(--warn-bg);color:var(--warn)}
.topbar{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;backdrop-filter:blur(10px);transition:background .3s}
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom));transition:background .3s}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.65rem;color:var(--muted);cursor:pointer;transition:color .2s;position:relative}.ni.on{color:var(--primary)}.ni svg{width:22px;height:22px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;animation:fadeIn .2s}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--card);border-radius:20px 20px 0 0;z-index:70;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:su .3s ease-out;max-height:90vh;overflow-y:auto;transition:background .3s}
.splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary);z-index:100;animation:fadeIn .3s}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 24px;color:var(--muted);text-align:center;gap:12px}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:var(--r);background:var(--fg);color:var(--bg);font-size:.9rem;font-weight:500;z-index:200;animation:ti .3s ease-out;white-space:nowrap}
.divider{height:1px;background:var(--border);margin:12px 0}.orn{text-align:center;position:relative;margin:20px 0}.orn::before{content:'';position:absolute;top:50%;left:0;right:0;height:1px;background:var(--border)}.orn span{background:var(--bg);padding:0 12px;position:relative;color:var(--muted);font-size:.85rem}
.toggle{position:relative;width:48px;height:26px;cursor:pointer}.toggle input{opacity:0;width:0;height:0}.toggle .slider{position:absolute;inset:0;background:var(--border);border-radius:26px;transition:.3s}.toggle .slider::before{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;right:3px;transition:.3s}.toggle input:checked+.slider{background:var(--primary)}.toggle input:checked+.slider::before{transform:translateX(-22px)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.flex-c{display:flex;align-items:center}.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.p-1{padding:4px}.p-2{padding:8px}.p-3{padding:12px}.p-4{padding:16px}.pb-20{padding-bottom:100px}
.text-sm{font-size:.82rem}.text-xs{font-size:.72rem}.text-lg{font-size:1.15rem}.text-xl{font-size:1.4rem}.text-2xl{font-size:1.8rem}.text-center{text-align:center}.text-muted{color:var(--muted)}.font-b{font-weight:700}.font-800{font-weight:800}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.w-full{width:100%}
.space-y-1>*+*{margin-top:4px}.space-y-2>*+*{margin-top:8px}.space-y-3>*+*{margin-top:12px}
.gold{color:var(--accent)}.gold-glow{text-shadow:0 0 20px rgba(212,160,32,.4)}
.fab{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);margin-left:calc(250px - 36px);width:56px;height:56px;border-radius:50%;background:var(--primary);color:var(--primary-fg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:45;transition:all .2s}.fab:active{transform:translateX(-50%) scale(.9)}
.tab{flex:1;padding:8px;text-align:center;font-size:.85rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s}.tab.on{color:var(--primary);border-color:var(--primary)}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.9rem;flex-shrink:0}
.progress-bar{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}.progress-bar>div{height:100%;background:var(--primary);border-radius:3px;transition:width .4s}
.skeleton{background:linear-gradient(90deg,var(--bg2) 25%,var(--border) 50%,var(--bg2) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:var(--r)}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:20px;font-size:.78rem;background:var(--bg2);color:var(--fg2)}
.star{color:var(--accent);font-size:1.1rem}.star.empty{color:var(--border)}
@keyframes su{from{transform:translateX(-50%) translateY(100%)}to{transform:translateX(-50%) translateY(0)}}
@keyframes ti{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media(max-width:500px){.app{max-width:100%}.sheet{max-width:100%}.bottomnav{max-width:100%}.fab{margin-left:calc(50vw - 36px)}.modal-sheet,.confirm-dialog{max-width:100%}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;animation:fadeIn .2s;display:flex;align-items:center;justify-content:center}
.modal-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--card);border-radius:20px 20px 0 0;z-index:70;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));animation:su .3s ease-out;max-height:90vh;overflow-y:auto;transition:background .3s}
.modal-sheet.wide{max-width:600px}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-header h3{font-size:1.1rem;font-weight:700}
.modal-close{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--muted);cursor:pointer;border:none;font-family:inherit}
.modal-body{display:flex;flex-direction:column;gap:12px}
.confirm-dialog{background:var(--card);border-radius:var(--r);padding:24px;max-width:360px;width:90%;text-align:center;animation:fadeIn .2s;z-index:70;position:relative}
.confirm-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px}
.confirm-dialog h3{font-size:1.1rem;font-weight:700;margin-bottom:8px}
.confirm-dialog p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
.confirm-actions{display:flex;gap:10px;justify-content:center}
.btn-ghost{background:var(--bg2);color:var(--fg2);border:1px solid var(--border)}.btn-primary{background:var(--primary);color:var(--primary-fg)}.btn-danger{background:var(--danger);color:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40}
.topbar-right,.topbar-center,.topbar-left{display:flex;align-items:center;gap:8px}
.topbar-title{font-size:1rem;font-weight:700}
.topbar-back{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg2);color:var(--fg);cursor:pointer;border:none}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:500px;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:50;padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.bnav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.65rem;color:var(--muted);cursor:pointer;transition:color .2s;background:none;border:none;font-family:inherit}
.bnav-item.active{color:var(--primary)}
.bnav-item svg{width:22px;height:22px}
.more-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:8px 0}
.more-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r);background:var(--bg2);cursor:pointer;border:none;font-family:inherit;font-size:.8rem;font-weight:600;color:var(--fg);transition:background .2s}
.more-item:hover{background:var(--border)}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:transform .2s}
.stat-card:active{transform:scale(.97)}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-icon svg{width:20px;height:20px}
.stat-label{font-size:.75rem;color:var(--muted);margin-bottom:2px}
.stat-value{font-size:1.2rem;font-weight:800}
.star-rating{display:flex;gap:4px}
.star-btn{background:none;border:none;cursor:pointer;padding:2px;color:var(--border);font-size:1.2rem;transition:color .2s}
.star-btn.filled{color:var(--accent)}
.star-btn:disabled{cursor:default}
.page{min-height:100vh;background:var(--bg)}
</style>
</head>

let _toastTimer=null;
function toast(msg,type='info'){
  let el=document.getElementById('_toast');
  if(el)el.remove();
  clearTimeout(_toastTimer);
  el=document.createElement('div');
  el.id='_toast';
  el.className='toast';

  else if(type==='error')el.style.background='var(--danger)';
  else if(type==='warn')el.style.background='var(--warn)';
  el.textContent=msg;
  document.body.appendChild(el);
  _toastTimer=setTimeout(()=>{el.remove()},2500);
}

// --- SPLASH SCREEN ---
function Splash({ onDone }) {
  const svgRef = React.useRef(null);
  const [done, setDone] = React.useState(false);
  const R = 68, C = 2 * Math.PI * R;
  const dur = 2800;

  React.useEffect(() => {
    const t0 = performance.now();
    const circle = svgRef.current;
    let raf;
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
    const tick = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      const ep = easeOutCubic(p);
      if (circle) {
        circle.setAttribute('stroke-dashoffset', C * (1 - ep));
        const angle = -Math.PI / 2 + ep * 2 * Math.PI;
        const dot = circle.parentElement.querySelector('.led-dot');
        if (dot) {
          dot.setAttribute('cx', 80 + R * Math.cos(angle));
          dot.setAttribute('cy', 80 + R * Math.sin(angle));
        }
      }
      if (p < 1) { raf = requestAnimationFrame(tick); }
      else { setTimeout(() => setDone(true), 300); setTimeout(onDone, 900); }
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, []);

  return (
    <div className={`splash ${done ? 'out' : ''}`}>
      <div className="splash-content">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle cx="80" cy="80" r={R} fill="none" stroke="var(--border)" strokeWidth="4" />
          <circle ref={svgRef} cx="80" cy="80" r={R} fill="none" stroke="var(--primary)" strokeWidth="4"
            strokeLinecap="round" strokeDasharray={C} strokeDashoffset={C} transform="rotate(-90 80 80)" />
          <circle className="led-dot" cx="80" cy={80 - R} r="5" fill="var(--primary)">
            <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite" />
          </circle>
        </svg>
        <div style={{ position: 'absolute', top: 46, left: '50%', transform: 'translateX(-50%)' }}>
          <Logo s={48} />
        </div>
      </div>
      <h1 style={{ fontSize: 28, fontWeight: 700, margin: '12px 0 2px', color: 'var(--fg)' }}>معلمي</h1>
      <p style={{ fontSize: 13, letterSpacing: 3, color: 'var(--muted)', marginBottom: 6 }}>MOALLEMY</p>
      <p style={{ color: 'var(--accent)', fontWeight: 600, fontSize: 15, margin: 0 }}>نلهم، نعلّم، نشبّ</p>
      <p style={{ color: 'var(--muted)', fontSize: 11, margin: '18px 0 0', opacity: 0.6 }}>Created & Designed by Amir Anwar Mohamed</p>
    </div>
  );
}

function Modal({ title, onClose, children, wide }) {
  React.useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [onClose]);
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className={`modal-sheet ${wide ? 'wide' : ''}`} onClick={e => e.stopPropagation()}>
        <div className="modal-header">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Ic n="x" /></button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

function Dashboard({go}) {
  const students = ld('students') || [];
  const groups = ld('groups') || [];
  const payments = ld('payments') || [];
  const sessions = ld('sessions') || [];
  const subscriptions = ld('subscriptions') || [];
  const studentGroups = ld('studentGroups') || [];

  let teacherName = 'المدرس';
  try { const t = JSON.parse(lo('mo_teacher')); if (t && t.name) teacherName = t.name; } catch(e) {}

  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'صباح الخير' : 'مساء الخير';
  const todayInfo = gAD(1)[0];

  const now = new Date();
  const monthlyTotal = payments.filter(p => {
    const d = new Date(p.createdAt || p.date || now);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  }).reduce((s, p) => s + (Number(p.amount) || 0), 0);

  const unpaidCount = subscriptions.filter(s => !s.paid && !s.exempt).length;

  const todayStr = now.toISOString().slice(0, 10);
  const upcomingSessions = sessions
    .filter(s => s.date >= todayStr)
    .sort((a, b) => a.date.localeCompare(b.date) || (a.startTime || '').localeCompare(b.startTime || ''))
    .slice(0, 3);

  const getGroupStudentCount = (groupId) => studentGroups.filter(sg => sg.groupId === groupId).length;

  let tip = '';
  if (students.length === 0) tip = 'أضف طلابك لبدء إدارة الدروس';
  else if (unpaidCount > 3) tip = 'لديك ' + unpaidCount + ' مستحقات غير مدفوعة، تابع تحصيلها';
  else if (groups.length === 0) tip = 'أنشئ مجموعات الدروس لتنظيم الطلاب';
  else if (sessions.length === 0) tip = 'جدول جلساتك فارغ، أضف جلسات جديدة';
  else tip = 'أحسنت! استمر في تنظيم دروسك بكفاءة';

  const quickActions = [
    { icon: 'uP', label: 'إضافة طالب', page: 'students', param: 'add' },
    { icon: 'gR', label: 'إضافة مجموعة', page: 'groups', param: 'add' },
    { icon: 'cC', label: 'تسجيل حضور', page: 'attendance' },
    { icon: 'fT', label: 'إضافة اختبار', page: 'grades', param: 'add' },
    { icon: 'w', label: 'تسجيل دفعة', page: 'financial', param: 'add' },
  ];

  return (
    <div style={{padding: '0 16px 100px'}}>
      <div style={{marginBottom: 16}}>
        <h2 style={{fontSize: 22, fontWeight: 700, margin: 0}}>
          {greeting}، {teacherName} {'👋'}
        </h2>
        <p style={{color: 'var(--muted)', fontSize: 14, margin: '4px 0 0'}}>
          {todayInfo.day} {todayInfo.num} {todayInfo.month}
        </p>
      </div>

      <div style={{height: 3, borderRadius: 2, background: 'linear-gradient(90deg, transparent, #d4a020, #f0c040, #d4a020, transparent)', margin: '0 0 20px'}} />

      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 20}}>
        <StatCard icon="u" label={"إجمالي الطلاب"} value={students.length} color="#1a7a7a" />
        <StatCard icon="gR" label={"المجموعات"} value={groups.length} color="#6c5ce7" />
        <StatCard icon="w" label={"المدفوعات الشهر"} value={cur(monthlyTotal)} color="#28a745" />
        <StatCard icon="alT" label={"المستحقون"} value={unpaidCount} color="#dc3545" />
      </div>

      <h3 style={{fontSize: 16, fontWeight: 700, margin: '0 0 12px'}}>إجراءات سريعة</h3>
      <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 24}}>
        {quickActions.map(a => (
          <div key={a.label} onClick={() => go(a.page, a.param)}
            style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: '14px 8px', textAlign: 'center', cursor: 'pointer', border: '1px solid var(--border)', transition: 'transform .15s'}}>
            <Ic n={a.icon} s={24} c="var(--primary)" />
            <div style={{fontSize: 11, marginTop: 6, color: 'var(--fg2)', fontWeight: 500}}>{a.label}</div>
          </div>
        ))}
      </div>

      <h3 style={{fontSize: 16, fontWeight: 700, margin: '0 0 12px'}}>الجلسات القادمة</h3>
      {upcomingSessions.length === 0 ? (
        <div style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 24, textAlign: 'center', color: 'var(--muted)', border: '1px solid var(--border)', marginBottom: 24}}>
          <Ic n="cal" s={32} c="var(--muted)" />
          <p style={{marginTop: 8, fontSize: 14}}>لا توجد جلسات قادمة</p>
        </div>
      ) : (
        <div style={{display: 'flex', flexDirection: 'column', gap: 10, marginBottom: 24}}>
          {upcomingSessions.map(ses => {
            const grp = groups.find(g => g.id === ses.groupId);
            const count = getGroupStudentCount(ses.groupId);
            return (
              <div key={ses.id} style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 14, border: '1px solid var(--border)', display: 'flex', alignItems: 'center', gap: 12}}>
                <div style={{width: 44, height: 44, borderRadius: 10, background: 'var(--primary-l)', display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0}}>
                  <Ic n="cal" s={22} c="var(--primary)" />
                </div>
                <div style={{flex: 1, minWidth: 0}}>
                  <div style={{fontWeight: 600, fontSize: 14, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>{grp ? grp.name : 'مجموعة محذوفة'}</div>
                  <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>{fD(ses.date)} - {ses.time || ''}</div>
                </div>
                <div style={{fontSize: 12, color: 'var(--primary)', fontWeight: 600, flexShrink: 0}}>
                  {count} طالب
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div style={{background: 'var(--warn-bg)', borderRadius: 'var(--r)', padding: 16, border: '1px solid var(--warn)', display: 'flex', alignItems: 'center', gap: 12}}>
        <Ic n="lB" s={22} c="var(--warn)" />
        <div>
          <div style={{fontWeight: 700, fontSize: 13, marginBottom: 2}}>نصيحة ذكية</div>
          <div style={{fontSize: 13, color: 'var(--fg2)'}}>{tip}</div>
        </div>
      </div>
    </div>
  );
}

// --- STUDENTS PAGE ---
function StudentsPage({go}) {
  const [students, setStudents] = useState(() => ld('students') || []);
  const groups = ld('groups') || [];
  const studentGroups = ld('studentGroups') || [];
  const [query, setQuery] = useState('');
  const [statusFilter, setStatusFilter] = useState('all');
  const [showAdd, setShowAdd] = useState(false);
  const [showDelete, setShowDelete] = useState(false);
  const [delStudent, setDelStudent] = useState(null);
  const [form, setForm] = useState({name:'',phone:'',parentPhone:'',parentName:'',stage:'',grade:'',school:'',notes:''});

  const filtered = students.filter(s => {
    const matchSearch = !query || s.name.includes(query) || (s.phone || '').includes(query);
    const matchStatus = statusFilter === 'all' || s.status === statusFilter;
    return matchSearch && matchStatus;
  });

  const getStudentGroups = (studentId) => {
 const sgs = studentGroups.filter(sg => sg.studentId === studentId);
    return sgs.map(sg => groups.find(g => g.id === sg.groupId)).filter(Boolean);
  };

  const handleSave = () => {
    if (!form.name.trim()) { toast('اسم الطالب مطلوب', 'error'); return; }
    const newStudent = {
      id: uid(),
      name: form.name.trim(),
      phone: form.phone.trim(),
      parentPhone: form.parentPhone.trim(),
      parentName: form.parentName.trim(),
      stage: form.stage,
      grade: form.grade.trim(),
      school: form.school.trim(),
      notes: form.notes.trim(),
      status: 'active',
      createdAt: td()
    };
    const updated = [...students, newStudent];
    sv('students', updated);
    setStudents(updated);
    setShowAdd(false);
    setForm({name:'',phone:'',parentPhone:'',parentName:'',stage:'',grade:'',school:'',notes:''});
    toast('تم إضافة الطالب بنجاح', 'success');
  };

  const handleDelete = () => {
    if (!delStudent) return;
    const updated = students.filter(s => s.id !== delStudent.id);
    sv('students', updated);
    setStudents(updated);
    const updatedSG = studentGroups.filter(sg => sg.studentId !== delStudent.id);
    sv('studentGroups', updatedSG);
    setShowDelete(false);
    setDelStudent(null);
    toast('تم حذف الطالب', 'success');
  };

  const statusLabel = (st) => {
    if (st === 'active') return 'نشط';
    if (st === 'stopped') return 'متوقف';
    if (st === 'withdrawn') return 'منسحب';
    return st;
  };

  const statusStyle = (st) => {
    if (st === 'active') return {background: 'var(--success-bg)', color: 'var(--success)', padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600};
    if (st === 'stopped') return {background: 'var(--danger-bg)', color: 'var(--danger)', padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600};
    return {background: 'var(--bg2)', color: 'var(--muted)', padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600};
  };

  const filterChips = [
    {key: 'all', label: 'الكل'},
    {key: 'active', label: 'نشط'},
    {key: 'stopped', label: 'متوقف'},
    {key: 'withdrawn', label: 'منسحب'},
  ];

  return (
    <div style={{padding: '0 16px 100px'}}>
      <div style={{display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12}}>
        <h2 style={{fontSize: 20, fontWeight: 700, margin: 0}}>الطلاب <span style={{color: 'var(--muted)', fontWeight: 400, fontSize: 15}}>({filtered.length})</span></h2>
      </div>

      <input className="inp" placeholder={"بحث بالاسم أو الهاتف..."} value={query}
        onChange={e => setQuery(e.target.value)}
        style={{marginBottom: 12}} />

      <div style={{display: 'flex', gap: 8, marginBottom: 16, overflowX: 'auto', paddingBottom: 4}}>
        {filterChips.map(ch => (
          <button key={ch.key} onClick={() => setStatusFilter(ch.key)}
            style={{padding: '6px 16px', borderRadius: 20, border: '1px solid', borderColor: statusFilter === ch.key ? 'var(--primary)' : 'var(--border)',
              background: statusFilter === ch.key ? 'var(--primary)' : 'var(--card)', color: statusFilter === ch.key ? 'var(--primary-fg)' : 'var(--fg2)',
              fontSize: 13, fontWeight: 500, cursor: 'pointer', whiteSpace: 'nowrap', fontFamily: 'inherit', transition: 'all .2s'}}>
            {ch.label}
          </button>
        ))}
      </div>

      {filtered.length === 0 ? (
        <div style={{textAlign: 'center', padding: '40px 0', color: 'var(--muted)'}}>
          <Ic n="us" s={48} c="var(--muted)" />
          <p style={{marginTop: 12, fontSize: 14}}>لا يوجد طلاب</p>
        </div>
      ) : (
        <div style={{display: 'flex', flexDirection: 'column', gap: 10}}>
          {filtered.map(st => {
            const sGroups = getStudentGroups(st.id);
            return (
              <div key={st.id} onClick={() => go('student-detail', st.id)}
                style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 14, border: '1px solid var(--border)',
                  display: 'flex', alignItems: 'center', gap: 12, cursor: 'pointer', transition: 'transform .15s'}}>
                <Avatar name={st.name} size={44} />
                <div style={{flex: 1, minWidth: 0}}>
                  <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap'}}>
                    <span style={{fontWeight: 700, fontSize: 15}}>{st.name}</span>
                    <span style={statusStyle(st.status)}>{statusLabel(st.status)}</span>
                  </div>
                  {st.phone && <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>{st.phone}</div>}
                  {st.stage && <div style={{display: 'inline-block', marginTop: 4, padding: '1px 8px', borderRadius: 6, fontSize: 10, background: 'var(--bg2)', color: 'var(--fg2)'}}>{st.stage}</div>}
                  {sGroups.length > 0 && (
                    <div style={{display: 'flex', gap: 4, marginTop: 6, flexWrap: 'wrap'}}>
                      {sGroups.map(g => (
                        <span key={g.id} style={{padding: '1px 8px', borderRadius: 6, fontSize: 10, background: 'var(--primary-l)', color: 'var(--primary)'}}>{g.name}</span>
                      ))}
                    </div>
                  )}
                </div>
                <button onClick={e => {e.stopPropagation(); setDelStudent(st); setShowDelete(true);}}
                  style={{background: 'none', border: 'none', cursor: 'pointer', padding: 6, borderRadius: 8, flexShrink: 0}}>
                  <Ic n="tr" s={18} c="var(--danger)" />
                </button>
              </div>
            );
          })}
        </div>
      )}

      <Fab onClick={() => setShowAdd(true)} />

      {showAdd && (
        <Modal title={"إضافة طالب جديد"} onClose={() => setShowAdd(false)} wide>
          <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الاسم *</label>
              <input className="inp" placeholder={"اسم الطالب"} value={form.name} onChange={e => setForm(p => ({...p, name: e.target.value}))} /></div>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الهاتف</label>
                <input className="inp" type="tel" placeholder={"رقم الهاتف"} value={form.phone} onChange={e => setForm(p => ({...p, phone: e.target.value}))} /></div>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>هاتف ولي الأمر</label>
                <input className="inp" type="tel" placeholder={"رقم ولي الأمر"} value={form.parentPhone} onChange={e => setForm(p => ({...p, parentPhone: e.target.value}))} /></div>
            </div>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>ولي الأمر</label>
              <input className="inp" placeholder={"اسم ولي الأمر"} value={form.parentName} onChange={e => setForm(p => ({...p, parentName: e.target.value}))} /></div>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>المرحلة</label>
              <select className="inp" value={form.stage} onChange={e => setForm(p => ({...p, stage: e.target.value}))}>
                <option value="">-- اختر المرحلة --</option>
                <option value={"ابتدائي"}>ابتدائي</option>
                <option value={"إعدادي"}>إعدادي</option>
                <option value={"ثانوي"}>ثانوي</option>
                <option value={"جامعي"}>جامعي</option>
                <option value={"أخرى"}>أخرى</option>
              </select></div>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الصف</label>
                <input className="inp" placeholder={"الصف الدراسي"} value={form.grade} onChange={e => setForm(p => ({...p, grade: e.target.value}))} /></div>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>المدرسة</label>
                <input className="inp" placeholder={"اسم المدرسة"} value={form.school} onChange={e => setForm(p => ({...p, school: e.target.value}))} /></div>
            </div>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>ملاحظات</label>
              <textarea className="inp" rows={3} placeholder={"ملاحظات إضافية"} value={form.notes} onChange={e => setForm(p => ({...p, notes: e.target.value}))} /></div>
            <button className="btn btn-p" style={{width: '100%', marginTop: 4}} onClick={handleSave}>حفظ الطالب</button>
          </div>
        </Modal>
      )}

      {showDelete && delStudent && (
        <ConfirmDialog title={"حذف طالب"} danger
          message={"هل أنت متأكد من حذف " + delStudent.name + "؟ سيتم حذف جميع البيانات المرتبطة بما فيها الحضور والدرجات والمدفوعات."}
          onConfirm={handleDelete} onCancel={() => {setShowDelete(false); setDelStudent(null);}} />
      )}
    </div>
  );
}

      school: editForm.school.trim(),

    const absent = myAttendance.filter(a => a.status === 'absent').length;
    const total = myAttendance.length;
    const pct = total > 0 ? Math.round((present / total) * 100) : 0;

    const attLabel = (st) => {
      if (st === 'present') return 'حاضر';
      if (st === 'absent') return 'غائب';
      if (st === 'late') return 'متأخر';
      if (st === 'excused') return 'معذور';
      return st;
    };
    const attStyle = (st) => {
      if (st === 'present') return {background: 'var(--success-bg)', color: 'var(--success)'};
      if (st === 'absent') return {background: 'var(--danger-bg)', color: 'var(--danger)'};
      if (st === 'late') return {background: 'var(--warn-bg)', color: 'var(--warn)'};
      return {background: 'var(--bg2)', color: 'var(--muted)'};
    };

    return (
      <div>
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 16}}>
          <div style={{background: 'var(--success-bg)', borderRadius: 'var(--r)', padding: 12, textAlign: 'center'}}>
            <div style={{fontSize: 22, fontWeight: 700, color: 'var(--success)'}}>{present}</div>
            <div style={{fontSize: 12, color: 'var(--success)', marginTop: 2}}>حاضر</div>
          </div>
          <div style={{background: 'var(--danger-bg)', borderRadius: 'var(--r)', padding: 12, textAlign: 'center'}}>
            <div style={{fontSize: 22, fontWeight: 700, color: 'var(--danger)'}}>{absent}</div>
            <div style={{fontSize: 12, color: 'var(--danger)', marginTop: 2}}>غائب</div>
          </div>
          <div style={{background: 'var(--bg2)', borderRadius: 'var(--r)', padding: 12, textAlign: 'center'}}>
            <div style={{fontSize: 22, fontWeight: 700}}>{total}</div>
            <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>الإجمالي</div>
          </div>
        </div>
        <div style={{marginBottom: 16}}>
          <div style={{display: 'flex', justifyContent: 'space-between', fontSize: 13, marginBottom: 4}}>
            <span>نسبة الحضور</span>
            <span style={{fontWeight: 700}}>{pct}%</span>
          </div>
          <div style={{height: 8, borderRadius: 4, background: 'var(--bg2)', overflow: 'hidden'}}>
            <div style={{height: '100%', borderRadius: 4, width: pct + '%', background: pct >= 75 ? 'var(--success)' : pct >= 50 ? 'var(--warn)' : 'var(--danger)', transition: 'width .3s'}} />
          </div>
        </div>
        {myAttendance.length === 0 ? (
          <div style={{textAlign: 'center', padding: 20, color: 'var(--muted)', fontSize: 14}}>لا توجد سجلات حضور</div>
        ) : (
          <div style={{display: 'flex', flexDirection: 'column', gap: 8}}>
            {myAttendance.slice().reverse().map(a => {
              const ses = sessions.find(s => s.id === a.sessionId);
              const grp = ses ? groups.find(g => g.id === ses.groupId) : null;
              return (
                <div key={a.id} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid var(--border)'}}>
                  <div>
                    <div style={{fontSize: 13, fontWeight: 600}}>{grp ? grp.name : 'جلسة'}</div>
                    <div style={{fontSize: 11, color: 'var(--muted)'}}>{a.date ? fD(a.date) : ''}</div>
                  </div>
                  <span style={{...attStyle(a.status), padding: '3px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600}}>{attLabel(a.status)}</span>
                </div>
              );
            })}
          </div>
        )}
      </div>
    );
  };

  // --- TAB 2: الدرجات ---
  const renderGrades = () => {
    const grades = ld('grades') || [];
    const tests = ld('tests') || [];
    const myGrades = grades.filter(g => g.grades && g.grades[id] !== undefined);

    if (myGrades.length === 0) {
      return <div style={{textAlign: 'center', padding: 20, color: 'var(--muted)', fontSize: 14}}>لا توجد درجات مسجلة</div>;
    }

    return (
      <div style={{display: 'flex', flexDirection: 'column', gap: 10}}>
        {myGrades.map(g => {
          const test = tests.find(t => t.id === g.testId);
          const grade = Number(g.grades[id]);
          const max = test ? Number(test.maxGrade) || 100 : 100;
          const pct = Math.round((grade / max) * 100);
          const passed = pct >= 60;
          return (
            <div key={g.testId} style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 14, border: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <div style={{fontWeight: 600, fontSize: 14}}>{test ? test.name : 'اختبار'}</div>
                <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>{test && test.date ? fSD(test.date) : ''}</div>
              </div>
              <div style={{textAlign: 'left'}}>
                <div style={{fontSize: 18, fontWeight: 700, color: passed ? 'var(--success)' : 'var(--danger)'}}>{grade}/{max}</div>
                <span style={{...passed ? {background: 'var(--success-bg)', color: 'var(--success)'} : {background: 'var(--danger-bg)', color: 'var(--danger)'}, padding: '2px 8px', borderRadius: 10, fontSize: 11, fontWeight: 600}}>{pct}%</span>
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  // --- TAB 3: الواجبات ---
  const renderHomework = () => {
    const homeworkStates = ld('homeworkStates') || [];
    const homework = ld('homework') || [];
    const myHW = homeworkStates.filter(h => h.states && h.states[id]);

    if (myHW.length === 0) {
      return <div style={{textAlign: 'center', padding: 20, color: 'var(--muted)', fontSize: 14}}>لا توجد واجبات مسجلة</div>;
    }

    const hwStatusLabel = (st) => {
      if (st === 'submitted') return 'تم التسليم';
      if (st === 'graded') return 'تم التصحيح';
      if (st === 'late') return 'متأخر';
      if (st === 'not_submitted') return 'لم يسلم';
      return st || 'غير محدد';
    };
    const hwStatusStyle = (st) => {
      if (st === 'graded') return {background: 'var(--success-bg)', color: 'var(--success)'};
      if (st === 'submitted') return {background: 'var(--primary-l)', color: 'var(--primary)'};
      if (st === 'late') return {background: 'var(--warn-bg)', color: 'var(--warn)'};
      return {background: 'var(--bg2)', color: 'var(--muted)'};
    };

    return (
      <div style={{display: 'flex', flexDirection: 'column', gap: 10}}>
        {myHW.map(hw => {
          const hwInfo = homework.find(h => h.id === hw.homeworkId);
          const state = hw.states[id];
          return (
            <div key={hw.homeworkId} style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 14, border: '1px solid var(--border)'}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
                <div style={{fontWeight: 600, fontSize: 14}}>{hwInfo ? hwInfo.title : 'واجب'}</div>
                <span style={{...hwStatusStyle(state.status), padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 600}}>{hwStatusLabel(state.status)}</span>
              </div>
              <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 4}}>
                {hwInfo && hwInfo.dueDate ? 'تاريخ التسليم: ' + fSD(hwInfo.dueDate) : ''}
                {state.grade !== undefined && state.grade !== null ? ' | الدرجة: ' + state.grade : ''}
              </div>
            </div>
          );
        })}
      </div>
    );
  };

  // --- TAB 4: المدفوعات ---
  const renderPayments = () => {
    const payments = (ld('payments') || []).filter(p => p.studentId === id);
    const totalPaid = payments.reduce((s, p) => s + (Number(p.amount) || 0), 0);

    const methodLabel = (m) => {
      if (m === 'cash') return 'نقدي';
      if (m === 'transfer') return 'تحويل';
      if (m === 'vodafone') return 'فودافون كاش';
      return m || '-';
    };

    if (payments.length === 0) {
      return <div style={{textAlign: 'center', padding: 20, color: 'var(--muted)', fontSize: 14}}>لا توجد مدفوعات مسجلة</div>;
    }

    return (
      <div>
        <div style={{background: 'var(--success-bg)', borderRadius: 'var(--r)', padding: 14, marginBottom: 16, textAlign: 'center'}}>
          <div style={{fontSize: 12, color: 'var(--success)'}}>إجمالي المدفوعات</div>
          <div style={{fontSize: 24, fontWeight: 700, color: 'var(--success)'}}>{cur(totalPaid)}</div>
        </div>
        <div style={{display: 'flex', flexDirection: 'column', gap: 10}}>
          {payments.slice().reverse().map(p => (
            <div key={p.id} style={{background: 'var(--card)', borderRadius: 'var(--r)', padding: 14, border: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div>
                <div style={{fontSize: 16, fontWeight: 700}}>{cur(p.amount)}</div>
                <div style={{fontSize: 12, color: 'var(--muted)', marginTop: 2}}>{p.month || ''} {p.createdAt ? fSD(p.createdAt) : ''}</div>
              </div>
              <div style={{display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4}}>
                <span style={{background: 'var(--bg2)', padding: '2px 10px', borderRadius: 20, fontSize: 11, fontWeight: 500}}>{methodLabel(p.method)}</span>
                {p.status && <span style={{...{background: p.status === 'paid' ? 'var(--success-bg)' : 'var(--warn-bg)', color: p.status === 'paid' ? 'var(--success)' : 'var(--warn)'}, padding: '2px 8px', borderRadius: 10, fontSize: 10, fontWeight: 600}}>{p.status === 'paid' ? 'مدفوع' : p.status === 'partial' ? 'جزئي' : 'معلق'}</span>}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  };

  // --- TAB 5: التقييم ---
  const renderEvaluation = () => {
    const evaluations = ld('evaluations') || [];
    const ev = evaluations.find(e => e.studentId === id);
    const [evalData, setEvalData] = useState(ev || null);
    const [isEditing, setIsEditing] = useState(!ev);

    const criteria = [
      {key: 'achievement', label: 'الإنجاز'},
      {key: 'commitment', label: 'الالتزام'},
      {key: 'attendanceRating', label: 'الانتظام'},
      {key: 'participation', label: 'المشاركة'},
      {key: 'homeworkPerf', label: 'أداء الواجبات'},
      {key: 'behavior', label: 'السلوك'},
    ];

    const handleCreate = () => {
      const newEv = {
        studentId: id,
        achievement: 0, commitment: 0, attendanceRating: 0,
        participation: 0, homeworkPerf: 0, behavior: 0,
        overallRating: 0, notes: '',
        period: AM[new Date().getMonth()]
      };
      const updated = [...evaluations, newEv];
      sv('evaluations', updated);
      setEvalData(newEv);
      setIsEditing(true);
    };

    const handleRatingChange = (key, val) => {
      const updated = {...evalData, [key]: val};
      const avg = Math.round(criteria.reduce((s, c) => s + (updated[c.key] || 0), 0) / criteria.length);
      updated.overallRating = avg;
      setEvalData(updated);
      const evs = (ld('evaluations') || []).map(e => e.studentId === id ? updated : e);
      sv('evaluations', evs);
    };

    const handleNotesChange = (notes) => {
      const updated = {...evalData, notes: notes};
      setEvalData(updated);
      const evs = (ld('evaluations') || []).map(e => e.studentId === id ? updated : e);
      sv('evaluations', evs);
    };

    if (!evalData) {
      return (
        <div style={{textAlign: 'center', padding: 30}}>
          <Ic n="st" s={48} c="var(--muted)" />
          <p style={{marginTop: 12, color: 'var(--muted)', fontSize: 14}}>لا يوجد تقييم</p>
          <button className="btn btn-p" style={{marginTop: 12}} onClick={handleCreate}>إنشاء تقييم</button>
        </div>
      );
    }

    return (
      <div style={{display: 'flex', flexDirection: 'column', gap: 16}}>
        {criteria.map(c => (
          <div key={c.key} style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
            <span style={{fontSize: 14, fontWeight: 500}}>{c.label}</span>
            <StarRating value={evalData[c.key] || 0} onChange={v => handleRatingChange(c.key, v)} />
          </div>
        ))}
        <div style={{borderTop: '1px solid var(--border)', paddingTop: 12}}>
          <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8}}>
            <span style={{fontSize: 15, fontWeight: 700}}>التقييم العام</span>
            <StarRating value={evalData.overallRating || 0} onChange={v => handleRatingChange('overallRating', v)} />
          </div>
        </div>
        <div>
          <label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>ملاحظات التقييم</label>
          <textarea className="inp" rows={3} placeholder={"ملاحظات..."} value={evalData.notes || ''} onChange={e => handleNotesChange(e.target.value)} />
        </div>
      </div>
    );
  };

  // --- TAB 6: الملاحظات ---
  const renderNotes = () => (
    <div>
      {student.notes ? (
        <div style={{background: 'var(--bg2)', borderRadius: 'var(--r)', padding: 16, fontSize: 14, lineHeight: 1.8, whiteSpace: 'pre-wrap'}}>{student.notes}</div>
      ) : (
        <div style={{textAlign: 'center', padding: 20, color: 'var(--muted)', fontSize: 14}}>لا توجد ملاحظات</div>
      )}
    </div>
  );

  const tabContent = [renderData, renderAttendance, renderGrades, renderHomework, renderPayments, renderEvaluation, renderNotes];

  return (
    <div style={{padding: '0 16px 100px'}}>
      {/* Header */}
      <div style={{display: 'flex', alignItems: 'center', gap: 16, marginBottom: 20}}>
        <Avatar name={student.name} size={64} />
        <div style={{flex: 1, minWidth: 0}}>
          <div style={{display: 'flex', alignItems: 'center', gap: 8, flexWrap: 'wrap', marginBottom: 4}}>
            <h2 style={{fontSize: 20, fontWeight: 700, margin: 0}}>{student.name}</h2>
            <span style={statusStyle(student.status)}>{statusLabel(student.status)}</span>
          </div>
          {student.phone && (
            <div style={{display: 'flex', alignItems: 'center', gap: 6, color: 'var(--muted)', fontSize: 14}}>
              <Ic n="ph" s={14} c="var(--muted)" /> {student.phone}
            </div>
          )}
        </div>
      </div>

      {/* Action buttons */}
      <div style={{display: 'flex', gap: 10, marginBottom: 20}}>
        <button className="btn btn-o btn-sm" onClick={openEdit} style={{flex: 1}}>
          <Ic n="ed" s={16} /> تعديل
        </button>
        {waLink && (
          <a href={waLink} target="_blank" rel="noopener noreferrer" className="btn btn-sm"
            style={{flex: 1, textDecoration: 'none', display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, background: '#25d366', color: '#fff', borderRadius: 'var(--r)', border: 'none', fontFamily: 'inherit', fontWeight: 600, cursor: 'pointer'}}>
            <Ic n="wa" s={16} c="#fff" /> واتساب
          </a>
        )}
      </div>

      {/* Tabs */}
      <TabBar tabs={tabs} active={activeTab} onChange={setActiveTab} />
      <div style={{marginTop: 16}}>
        {tabContent[activeTab]()}
      </div>

      {/* Edit Modal */}
      {showEdit && (
        <Modal title={"تعديل بيانات الطالب"} onClose={() => setShowEdit(false)} wide>
          <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الاسم *</label>
              <input className="inp" placeholder={"اسم الطالب"} value={editForm.name} onChange={e => setEditForm(p => ({...p, name: e.target.value}))} /></div>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الهاتف</label>
                <input className="inp" type="tel" placeholder={"رقم الهاتف"} value={editForm.phone} onChange={e => setEditForm(p => ({...p, phone: e.target.value}))} /></div>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>هاتف ولي الأمر</label>
                <input className="inp" type="tel" placeholder={"رقم ولي الأمر"} value={editForm.parentPhone} onChange={e => setEditForm(p => ({...p, parentPhone: e.target.value}))} /></div>
            </div>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>ولي الأمر</label>
              <input className="inp" placeholder={"اسم ولي الأمر"} value={editForm.parentName} onChange={e => setEditForm(p => ({...p, parentName: e.target.value}))} /></div>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>المرحلة</label>
                <select className="inp" value={editForm.stage} onChange={e => setEditForm(p => ({...p, stage: e.target.value}))}>
                  <option value="">-- اختر --</option>
                  <option value={"ابتدائي"}>ابتدائي</option>
                  <option value={"إعدادي"}>إعدادي</option>
                  <option value={"ثانوي"}>ثانوي</option>
                  <option value={"جامعي"}>جامعي</option>
                  <option value={"أخرى"}>أخرى</option>
                </select></div>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الحالة</label>
                <select className="inp" value={editForm.status} onChange={e => setEditForm(p => ({...p, status: e.target.value}))}>
                  <option value={"active"}>نشط</option>
                  <option value={"stopped"}>متوقف</option>
                  <option value={"withdrawn"}>منسحب</option>
                </select></div>
            </div>
            <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10}}>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>الصف</label>
                <input className="inp" placeholder={"الصف"} value={editForm.grade} onChange={e => setEditForm(p => ({...p, grade: e.target.value}))} /></div>
              <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>المدرسة</label>
                <input className="inp" placeholder={"المدرسة"} value={editForm.school} onChange={e => setEditForm(p => ({...p, school: e.target.value}))} /></div>
            </div>
            <div><label style={{fontSize: 13, fontWeight: 600, marginBottom: 4, display: 'block'}}>ملاحظات</label>
              <textarea className="inp" rows={3} placeholder={"ملاحظات..."} value={editForm.notes} onChange={e => setEditForm(p => ({...p, notes: e.target.value}))} /></div>
            <button className="btn btn-p" style={{width: '100%', marginTop: 4}} onClick={handleEditSave}>حفظ التعديلات</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

              </div>

              </div>}

                {g.location && <span style={{display:'flex',alignItems:'center',gap:3}}>{Ic({n:'map-pin',s:12})} {g.location}</span>}

function GroupDetail({id, go}){
  const [activeTab, setActiveTab] = useState(0);
  const [showEdit, setShowEdit] = useState(false);
  const [editForm, setEditForm] = useState({});
  const [showAddStudent, setShowAddStudent] = useState(false);
  const [studentSearch, setStudentSearch] = useState('');
  const [showRemoveStudent, setShowRemoveStudent] = useState(false);
  const [removeId, setRemoveId] = useState(null);
  const [expandedHw, setExpandedHw] = useState(null);
  const dayNames = ['أحد','إثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  const tabLabels = ['الطلاب','الحضور','الاختبارات','الواجبات','المدفوعات','الإعلانات'];
  const groups = ld('groups') || [];
  const studentGroups = ld('studentGroups') || [];
  const allStudents = ld('students') || [];
  const allSessions = ld('sessions') || [];
  const allAttendance = ld('attendance') || [];
  const allTests = ld('tests') || [];
  const allGrades = ld('grades') || [];
  const allHomework = ld('homework') || [];
  const allHwStates = ld('homeworkStates') || [];
  const allSubscriptions = ld('subscriptions') || [];
  const allAnnouncements = ld('announcements') || [];
  const group = groups.find(g => g.id === id);
  const members = studentGroups.filter(sg => sg.groupId === id);
  const memberStudents = members.map(m => {
    const s = allStudents.find(st => st.id === m.studentId);
    return s ? {...s, individualFee: m.individualFee} : null;
  }).filter(Boolean);
  const groupSessions = allSessions.filter(s => s.groupId === id);
  const groupTests = allTests.filter(t => t.groupId === id);
  const groupHomework = allHomework.filter(h => h.groupId === id);
  const groupSubs = allSubscriptions.filter(s => s.groupId === id);
  const groupAnnouncements = allAnnouncements.filter(a => a.groupId === id);
  const getSessionAtt = (sid) => {
    const recs = allAttendance.filter(a => a.sessionId === sid);
    return {present: recs.filter(r=>r.status==='present').length, absent: recs.filter(r=>r.status==='absent').length, total: recs.length};
  };
  const getStudentAtt = (studentId) => {
    if(!groupSessions.length) return 0;
    let p = 0;
    groupSessions.forEach(s => { const r = allAttendance.find(a => a.sessionId===s.id && a.studentId===studentId); if(r && r.status==='present') p++; });
    return Math.round(p / groupSessions.length * 100);
  };
  const getTestAvg = (testId) => {
    const gr = allGrades.filter(g => g.testId === testId);
    if(!gr.length) return 0;
    return Math.round(gr.reduce((s,g)=>s+(Number(g.grade)||0),0)/gr.length);
  };
  const nonMembers = allStudents.filter(s => !members.some(m => m.studentId === s.id));
  const filteredNonMembers = nonMembers.filter(s => !studentSearch || s.name?.includes(studentSearch));
  const handleEditOpen = () => {
    if(!group) return;
    setEditForm({name:group.name,subject:group.subject||'',grade:group.grade||'',days:[...(group.days||[])],time:group.time||'',duration:group.duration||'',location:group.location||'',monthlyFee:group.monthlyFee||'',maxStudents:group.maxStudents||'',notes:group.notes||''});
    setShowEdit(true);
  };
  const toggleEditDay = (d) => setEditForm(p => ({...p, days: p.days.includes(d) ? p.days.filter(x=>x!==d) : [...p.days, d].sort()}));
  const handleEditSave = () => {
    if(!editForm.name?.trim()){toast('أدخل اسم المجموعة','e');return;}
    const updated = groups.map(g => g.id===id ? {...g, name:editForm.name.trim(), subject:editForm.subject.trim(), grade:editForm.grade.trim(), days:[...editForm.days], time:editForm.time, duration:editForm.duration, location:editForm.location.trim(), monthlyFee:Number(editForm.monthlyFee)||0, maxStudents:Number(editForm.maxStudents)||0, notes:editForm.notes.trim()} : g);
    sv('groups', updated); setShowEdit(false); toast('تم تعديل المجموعة','s');
  };
  const handleAddStudent = (studentId) => {
    sv('studentGroups', [...studentGroups, {studentId, groupId: id, individualFee: null}]);
    toast('تم إضافة الطالب','s');
  };
  const handleRemoveStudent = () => {
    sv('studentGroups', studentGroups.filter(sg => !(sg.studentId===removeId && sg.groupId===id)));
    setShowRemoveStudent(false); setRemoveId(null); toast('تم إزالة الطالب','s');
  };
  if(!group) return <div style={{textAlign:'center',padding:40,color:'#999'}}>المجموعة غير موجودة</div>;
